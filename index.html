<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8cfe1"><title>Little Steps Learning</title><link rel="manifest" href="manifest.webmanifest"><style>body{font-family:system-ui,sans-serif;background:#fff7ec;color:#343047;margin:0}main{max-width:760px;margin:auto;padding:24px}header{text-align:center;background:#f8cfe1;border-radius:24px;padding:24px}h1{margin:4px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{cursor:pointer;border:0;border-radius:14px;padding:13px 18px;background:#d4eddd;font-size:1rem;font-weight:650;color:#343047}button:focus-visible{outline:3px solid #333}button.active{background:#f5c2d8}section{background:white;border-radius:20px;padding:24px;min-height:230px;box-shadow:0 3px 12px #0001}.big{font-size:5rem;text-align:center;margin:12px}.center{text-align:center}.choices{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.note{font-size:.9rem;color:#615b6c}#feedback{font-weight:700;min-height:1.6em}footer{text-align:center;margin:25px}</style></head><body><main><header><div style="font-size:3rem">🌈 📚 🧸</div><h1>Little Steps Learning</h1><p>Learn, Play & Grow!</p></header><nav aria-label="Learning sections"><button class="active" data-page="letters">🔤 ABC</button><button data-page="numbers">🔢 Numbers</button><button data-page="quiz">⭐ Quiz</button><button data-page="drawing">🎨 Draw</button></nav><section id="content" aria-live="polite"></section><footer><p class="note">Made for learning together with a parent or caregiver. No accounts, ads, or data collection.</p></footer></main><script>const content=document.querySelector('#content');let letter=0,num=1,score=0;const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';function say(t){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.speak(u)}}function render(page){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='letters'){content.innerHTML=`<h2>Alphabet Adventure</h2><p class="center">Tap the letter to hear it!</p><div class="big">${letters[letter]}</div><div class="choices"><button id="prev">◀ Previous</button><button id="speak">🔊 Say letter</button><button id="next">Next ▶</button></div>`;document.querySelector('#prev').onclick=()=>{letter=(letter+25)%26;render(page)};document.querySelector('#next').onclick=()=>{letter=(letter+1)%26;render(page)};document.querySelector('#speak').onclick=()=>say(letters[letter]);}else if(page==='numbers'){content.innerHTML=`<h2>Counting Corner</h2><p class="center">Count the stars!</p><div class="big" style="font-size:2.5rem">${'⭐'.repeat(num)}</div><h2 class="center">${num}</h2><div class="choices"><button id="minus">−</button><button id="speak">🔊 Say number</button><button id="plus">+</button></div>`;document.querySelector('#minus').onclick=()=>{num=Math.max(1,num-1);render(page)};document.querySelector('#plus').onclick=()=>{num=Math.min(10,num+1);render(page)};document.querySelector('#speak').onclick=()=>say(String(num));}else if(page==='quiz'){let answer=Math.floor(Math.random()*5)+1;let choices=[1,2,3,4,5].sort(()=>Math.random()-.5);content.innerHTML=`<h2>Counting Quiz</h2><p>How many hearts do you see?</p><div class="big" style="font-size:2.4rem">${'❤️'.repeat(answer)}</div><div class="choices">${choices.map(n=>`<button data-answer="${n}">${n}</button>`).join('')}</div><p id="feedback" class="center" aria-live="polite"></p><p class="center">Correct answers: <span id="score">${score}</span></p><div class="center"><button id="again">New question ↻</button></div>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const correct=Number(b.dataset.answer)===answer;document.querySelector('#feedback').textContent=correct?'Great job! 🎉':'Try again!';if(correct){score++;document.querySelector('#score').textContent=score;document.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true)}say(correct?'Great job!':'Try again!')});document.querySelector('#again').onclick=()=>render(page);}else{content.innerHTML=`<h2>Free Drawing</h2><p>Use your finger or mouse to draw!</p><canvas id="pad" width="600" height="300" style="width:100%;border:2px solid #e7d5e0;border-radius:12px;touch-action:none;background:#fff" aria-label="Drawing canvas"></canvas><div class="choices"><button data-color="#ec4899">Pink</button><button data-color="#3b82f6">Blue</button><button data-color="#22c55e">Green</button><button id="clear">Clear</button></div>`;let canvas=document.querySelector('#pad'),ctx=canvas.getContext('2d'),drawing=false,color='#ec4899';function point(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]}canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...point(e))};canvas.onpointermove=e=>{if(!drawing)return;ctx.lineTo(...point(e));ctx.strokeStyle=color;ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()};canvas.onpointerup=()=>drawing=false;canvas.onpointercancel=()=>drawing=false;document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>color=b.dataset.color);document.querySelector('#clear').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height)}}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>render(b.dataset.page));render('letters');if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
