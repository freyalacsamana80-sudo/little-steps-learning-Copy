<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8cfe1">
<meta name="description" content="A playful, parent-guided learning app for preschool children.">
<title>Little Steps Learning</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--ink:#302b49;--muted:#706b80;--pink:#f7c7dc;--pink2:#fde8f1;--mint:#d7f0df;--yellow:#fff0bd;--blue:#dcecff;--lav:#e9e1ff;--paper:#fff8ef;--white:#fff;--line:#f0e8ed;--shadow:0 8px 24px #35234412;--radius:22px}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;line-height:1.45}button,select{font:inherit}button{border:0;border-radius:15px;padding:12px 16px;background:var(--mint);color:var(--ink);font-weight:750;cursor:pointer;transition:transform .12s,filter .12s}button:hover{filter:brightness(.98);transform:translateY(-1px)}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #8a6bd1;outline-offset:3px}button:disabled{opacity:.55;cursor:not-allowed;transform:none}.app{width:min(100% - 28px,960px);margin:18px auto 40px}.hero{position:relative;text-align:center;padding:27px 20px 24px;border-radius:28px;background:var(--pink);overflow:hidden}.hero .art{font-size:2.8rem;letter-spacing:9px}.hero h1{font-size:clamp(1.7rem,4vw,2.35rem);margin:4px 0}.hero p{margin:4px 0 0}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 2px;color:var(--muted);font-size:.9rem}.topline select{border:1px solid #e7dce5;background:#fff;border-radius:12px;padding:8px;color:var(--ink)}.nav{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.nav button{background:#fff;box-shadow:0 2px 8px #3523440b}.nav button.active{background:var(--pink)}.panel{background:#fff;border-radius:var(--radius);padding:clamp(18px,4vw,28px);box-shadow:var(--shadow);min-height:360px}.panel h2{margin:0 0 8px;font-size:1.45rem}.sub{color:var(--muted);margin:0 0 18px}.center{text-align:center}.muted{color:var(--muted)}.big{font-size:clamp(4rem,14vw,7rem);font-weight:850;line-height:1.1;margin:16px 0}.picture{font-size:clamp(2.6rem,9vw,4.5rem);margin:12px}.word{font-size:1.25rem;font-weight:800}.row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px}.tile{min-height:90px;background:#fff9fc;border:2px solid var(--line);border-radius:18px;padding:12px;display:grid;place-items:center;gap:3px}.tile strong{font-size:1.7rem}.tile span{font-size:.9rem;color:var(--muted)}.tile.selected{border-color:#d76c9e;background:var(--pink2)}.tile.correct{border-color:#5fa879;background:#effaf2}.tile.wrong{border-color:#d66b6b;background:#fff0f0}.soft{background:#f8f5ff}.yellow{background:var(--yellow)}.blue{background:var(--blue)}.pink{background:var(--pink2)}.mint{background:var(--mint)}.feedback{min-height:28px;margin:12px 0;font-weight:800;text-align:center}.progress{height:9px;background:#f0edf2;border-radius:99px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:#80c79a;width:0;transition:width .2s}.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0}.small{font-size:.9rem;padding:9px 12px}.number-display{font-size:2.6rem;font-weight:850}.starfield{font-size:clamp(1.5rem,5vw,2.5rem);line-height:1.55;overflow-wrap:anywhere;max-width:560px;margin:10px auto}.canvas-wrap{width:100%;background:#fffdfd;border:2px dashed #e7cbd9;border-radius:18px;padding:8px}.draw-canvas{display:block;width:100%;height:220px;touch-action:none;border-radius:12px;background:white}.trace-canvas{height:190px}.choice{min-width:72px;background:#f8f5ff}.choice:active{transform:scale(.98)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.memory-card{min-height:112px;font-size:2rem;background:var(--lav);border:2px solid transparent}.memory-card small{display:block;font-size:.8rem}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.pill{display:inline-block;background:#f8f5ff;border-radius:99px;padding:5px 10px;font-size:.82rem;color:var(--muted)}.footer{text-align:center;color:var(--muted);font-size:.86rem;margin:20px 10px}.parent-note{background:#fff8df;border-radius:14px;padding:12px;margin-top:16px;font-size:.9rem}.hidden{display:none!important}
@media(min-width:700px){.panel{padding:28px 32px}.draw-canvas{height:260px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="app">
<header class="hero"><div class="art" aria-hidden="true">🌈 📚 🧸</div><h1>Little Steps Learning</h1><p id="tagline">Learn, Play & Grow!</p></header>
<div class="topline"><span id="welcome">A happy place to practice every day ✨</span><label><span class="muted">Language </span><select id="language" aria-label="Choose language"><option value="en">English</option><option value="fil">Filipino</option></select></label></div>
<nav class="nav" aria-label="Learning sections">
<button class="active" data-page="abc">🔤 ABC</button><button data-page="numbers">🔢 Numbers</button><button data-page="trace">✍️ Trace</button><button data-page="color">🎨 Color</button><button data-page="quiz">⭐ Quiz</button><button data-page="match">🧩 Match</button>
</nav>
<section class="panel" id="content" aria-live="polite"></section>
<footer class="footer">Made for learning together with a parent or caregiver. No accounts, ads, chat, or data collection.</footer>
</main>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), content=$('#content');
const words=[['Apple','🍎','Mansanas'],['Ball','⚽','Bola'],['Cat','🐱','Pusa'],['Dog','🐶','Aso'],['Elephant','🐘','Elepante'],['Fish','🐟','Isda'],['Giraffe','🦒','Dyirap'],['House','🏠','Bahay'],['Ice cream','🍦','Sorbetes'],['Juice','🧃','Katas'],['Kite','🪁','Saranggola'],['Lion','🦁','Leon'],['Moon','🌙','Buwan'],['Nest','🪺','Pugad'],['Owl','🦉','Kuwago'],['Pizza','🍕','Pizza'],['Queen','👑','Reyna'],['Rainbow','🌈','Bahaghari'],['Sun','☀️','Araw'],['Tree','🌳','Puno'],['Umbrella','☂️','Payong'],['Violin','🎻','Biy violin'],['Whale','🐳','Balyena'],['Xylophone','🎼','Saylopon'],['Yoyo','🪀','Yoyo'],['Zebra','🦓','Sebra']];
const tr={en:{tag:'Learn, Play & Grow!',welcome:'A happy place to practice every day ✨',abc:'Alphabet Adventure',tap:'Tap a letter to learn its sound and word.',prev:'◀ Previous',next:'Next ▶',say:'🔊 Say it',numbers:'Counting Corner',count:'Count the objects, then explore numbers 1 to 100.',less:'−',more:'+',trace:'Tracing Practice',traceHelp:'Follow the dotted guide with your finger or mouse.',clear:'Clear',color:'Coloring Corner',colorHelp:'Choose a picture and color it with your finger or mouse.',quiz:'Learning Quiz',quizHelp:'Choose the correct answer. You can try again!',newQ:'New question ↻',score:'Correct answers',match:'Picture Match',matchHelp:'Find the matching pairs.',again:'Play again',great:'Great job! 🎉',try:'Nice try! Have another go.',choose:'Choose a picture',done:'You matched them all! Amazing!',reset:'Start over',parent:'Grown-up tip: Sit with your child, name the pictures, and celebrate every try.',numbersRange:'Number',add:'Addition',sub:'Subtraction',check:'Check answer',correct:'That is correct!',answer:'Try once more.',shape:'Choose a color',clearAll:'Clear drawing'},fil:{tag:'Matuto, Maglaro at Umunlad!',welcome:'Masayang lugar para magsanay araw-araw ✨',abc:'Pakikipagsapalaran sa Alpabeto',tap:'Pindutin ang letra para marinig ang tunog at salita.',prev:'◀ Nakaraan',next:'Susunod ▶',say:'🔊 Bigkasin',numbers:'Bilang Corner',count:'Bilangin ang mga bagay at tuklasin ang 1 hanggang 100.',less:'−',more:'+',trace:'Pagsasanay sa Pagsulat',traceHelp:'Sundan ang gabay gamit ang daliri o mouse.',clear:'Burahin',color:'Coloring Corner',colorHelp:'Pumili ng larawan at kulayan gamit ang daliri o mouse.',quiz:'Pagsusulit',quizHelp:'Piliin ang tamang sagot. Puwede kang sumubok ulit!',newQ:'Bagong tanong ↻',score:'Tamang sagot',match:'Pagtutugma ng Larawan',matchHelp:'Hanapin ang magkaparehong pares.',again:'Maglaro ulit',great:'Magaling! 🎉',try:'Ayos lang! Subukan ulit.',choose:'Pumili ng larawan',done:'Nahanap mo lahat! Ang galing!',reset:'Ulitin',parent:'Paalala sa magulang: Samahan ang bata, pangalanan ang mga larawan, at purihin ang bawat pagsubok.',numbersRange:'Bilang',add:'Pagdaragdag',sub:'Pagbabawas',check:'Tingnan ang sagot',correct:'Tama ang sagot!',answer:'Subukan muli.',shape:'Pumili ng kulay',clearAll:'Burahin ang guhit'}};
let lang='en',page='abc',letter=0,num=1,score=0,quizAnswer=0,quizLocked=false,matchCards=[],matchOpen=[],matchDone=[],drawColor='#ec4899',traceTarget='A';
const T=k=>tr[lang][k]||k;
function speak(text){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang==='fil'?'fil-PH':'en-US';window.speechSynthesis.speak(u)}
function nav(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function setPage(p){page=p;nav();render()}
function render(){nav();if(page==='abc')abc();else if(page==='numbers')numbers();else if(page==='trace')trace();else if(page==='color')coloring();else if(page==='quiz')quiz();else matching()}
function abc(){const ch=String.fromCharCode(65+letter),w=words[letter];content.innerHTML=`<div class="section-head"><h2>${T('abc')}</h2><span class="pill">${letter+1} / 26</span></div><p class="sub">${T('tap')}</p><div class="center"><div class="big">${ch} ${ch.toLowerCase()}</div><div class="picture">${w[1]}</div><div class="word">${w[0]} <span class="muted">· ${w[2]}</span></div></div><div class="toolbar"><button id="prev">${T('prev')}</button><button class="pink" id="say">${T('say')}</button><button id="next">${T('next')}</button></div><div class="progress"><span style="width:${(letter+1)/26*100}%"></span></div><p class="center muted">Tap any letter below to jump.</p><div class="grid">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map((x,i)=>`<button class="tile ${i===letter?'selected':''}" data-letter="${i}"><strong>${x}</strong><span>${words[i][1]}</span></button>`).join('')}</div><div class="parent-note">${T('parent')}</div>`;
$('#prev').onclick=()=>{letter=(letter+25)%26;abc()};$('#next').onclick=()=>{letter=(letter+1)%26;abc()};$('#say').onclick=()=>speak(`${ch}. ${w[0]}`);content.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>{letter=+b.dataset.letter;abc()});}
function numbers(){content.innerHTML=`<h2>${T('numbers')}</h2><p class="sub">${T('count')}</p><div class="center"><div class="starfield" aria-label="${num} stars">${'⭐'.repeat(Math.min(num,30))}${num>30?'…':''}</div><div class="number-display">${num}</div><p class="word">${num===1?'one':num===2?'two':num===3?'three':num===4?'four':num===5?'five':num===6?'six':num===7?'seven':num===8?'eight':num===9?'nine':num===10?'ten':num}</p><div class="toolbar"><button id="minus">${T('less')}</button><button class="pink" id="sayNum">🔊 ${num}</button><button id="plus">${T('more')}</button></div><div class="grid">${Array.from({length:100},(_,i)=>i+1).map(n=>`<button class="tile ${n===num?'selected':''}" data-num="${n}"><strong>${n}</strong></button>`).join('')}</div></div><div class="parent-note">${T('parent')}</div>`;$('#minus').onclick=()=>{num=Math.max(1,num-1);numbers()};$('#plus').onclick=()=>{num=Math.min(100,num+1);numbers()};$('#sayNum').onclick=()=>speak(String(num));content.querySelectorAll('[data-num]').forEach(b=>b.onclick=()=>{num=+b.dataset.num;numbers()})}
function trace(){const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');content.innerHTML=`<h2>${T('trace')}</h2><p class="sub">${T('traceHelp')}</p><div class="toolbar"><label class="pill">Letter <select id="tracePick" aria-label="Choose tracing letter">${alphabet.map(x=>`<option ${x===traceTarget?'selected':''}>${x}</option>`).join('')}</select></label><button id="clearTrace">${T('clear')}</button></div><div class="canvas-wrap"><canvas class="draw-canvas trace-canvas" id="tracePad" width="900" height="360" aria-label="Tracing canvas"></canvas></div><p class="center muted">Trace the large dotted letter.</p><div class="parent-note">${T('parent')}</div>`;const c=$('#tracePad'),ctx=c.getContext('2d');function guide(){ctx.clearRect(0,0,c.width,c.height);ctx.save();ctx.font='bold 270px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.setLineDash([12,12]);ctx.lineWidth=5;ctx.strokeStyle='#e5bfd1';ctx.strokeText(traceTarget,c.width/2,c.height/2+8);ctx.restore()}guide();let down=false,last=null;function pt(e){const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);last=pt(e)};c.onpointermove=e=>{if(!down)return;const p=pt(e);ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.strokeStyle='#ec4899';ctx.lineWidth=13;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();last=p};c.onpointerup=c.onpointercancel=()=>down=false;$('#clearTrace').onclick=guide;$('#tracePick').onchange=e=>{traceTarget=e.target.value;guide()}}
const coloringPics=[['🐱','Cat'],['🐟','Fish'],['🌸','Flower'],['🏠','House'],['🌈','Rainbow'],['🦋','Butterfly']];
function coloring(){content.innerHTML=`<h2>${T('color')}</h2><p class="sub">${T('colorHelp')}</p><p class="muted">${T('choose')}</p><div class="toolbar">${coloringPics.map((p,i)=>`<button class="small ${i===0?'pink':''}" data-pic="${i}">${p[0]} ${p[1]}</button>`).join('')}</div><div class="toolbar">${['#ec4899','#f59e0b','#3b82f6','#22c55e','#8b5cf6','#222222'].map((c,i)=>`<button class="small" data-color="${c}" style="background:${c};color:white">${['Pink','Yellow','Blue','Green','Purple','Black'][i]}</button>`).join('')}<button class="small" id="erase">${T('clear')}</button></div><div class="canvas-wrap"><canvas class="draw-canvas" id="colorPad" width="900" height="480" aria-label="Coloring canvas"></canvas></div><div class="toolbar"><button id="clearColor">${T('clearAll')}</button></div><div class="parent-note">${T('parent')}</div>`;let selected=0;const c=$('#colorPad'),ctx=c.getContext('2d');function picture(){ctx.clearRect(0,0,c.width,c.height);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='300px serif';ctx.fillStyle='#fff';ctx.fillText(coloringPics[selected][0],450,240);ctx.lineWidth=5;ctx.strokeStyle='#555';ctx.strokeText(coloringPics[selected][0],450,240)}picture();let down=false,last=null;function pt(e){const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);last=pt(e)};c.onpointermove=e=>{if(!down)return;const p=pt(e);ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.strokeStyle=drawColor;ctx.lineWidth=22;ctx.lineCap='round';ctx.stroke();last=p};c.onpointerup=c.onpointercancel=()=>down=false;content.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>drawColor=b.dataset.color);content.querySelectorAll('[data-pic]').forEach(b=>b.onclick=()=>{selected=+b.dataset.pic;picture()});$('#erase').onclick=()=>drawColor='#ffffff';$('#clearColor').onclick=picture}
function quiz(){const questions=[()=>{let a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);return {q:`${a} + ${b} = ?`,a:a+b,opts:[a+b,a+b+1,Math.max(1,a+b-1),a+b+2]}},()=>{let a=2+Math.floor(Math.random()*8),b=1+Math.floor(Math.random()*(a-1));return {q:`${a} − ${b} = ?`,a:a-b,opts:[a-b,a-b+1,a-b+2,Math.max(0,a-b-1)]}},()=>{let i=Math.floor(Math.random()*26);return {q:`Which letter starts ${words[i][0]}? ${words[i][1]}`,a:String.fromCharCode(65+i),opts:[String.fromCharCode(65+i),String.fromCharCode(65+(i+1)%26),String.fromCharCode(65+(i+2)%26),String.fromCharCode(65+(i+3)%26)]}}];let q=questions[Math.floor(Math.random()*questions.length)]();quizAnswer=q.a;quizLocked=false;let opts=[...new Set(q.opts)];while(opts.length<4)opts.push(typeof q.a==='number'?q.a+opts.length+1:String.fromCharCode(65+opts.length));opts.sort(()=>Math.random()-.5);content.innerHTML=`<h2>${T('quiz')}</h2><p class="sub">${T('quizHelp')}</p><div class="center"><div class="big" style="font-size:2.5rem">${q.q}</div><div class="grid">${opts.map(o=>`<button class="tile choice" data-choice="${o}"><strong>${o}</strong></button>`).join('')}</div><p class="feedback" id="quizFeedback"></p><p class="muted">${T('score')}: <strong>${score}</strong></p><button id="newQuiz" class="pink">${T('newQ')}</button></div>`;content.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(quizLocked)return;const ok=String(b.dataset.choice)===String(quizAnswer);$('#quizFeedback').textContent=ok?T('great'):T('try');b.classList.add(ok?'correct':'wrong');if(ok){score++;quizLocked=true;content.querySelectorAll('[data-choice]').forEach(x=>x.disabled=true);speak(T('great'))}else speak(T('try'))});$('#newQuiz').onclick=quiz}
function matching(){if(!matchCards.length)resetMatch();content.innerHTML=`<h2>${T('match')}</h2><p class="sub">${T('matchHelp')}</p><p class="center muted">Pairs found: ${matchDone.length/2} / 4</p><div class="cards">${matchCards.map((c,i)=>`<button class="memory-card" data-card="${i}" ${matchDone.includes(i)?'disabled':''}>${matchOpen.includes(i)||matchDone.includes(i)?c.emoji:'❔'}<small>${matchOpen.includes(i)||matchDone.includes(i)?c.name:'Tap to reveal'}</small></button>`).join('')}</div><p class="feedback" id="matchFeedback">${matchDone.length===8?T('done'):''}</p><div class="toolbar"><button id="resetMatch">${T('reset')}</button></div><div class="parent-note">${T('parent')}</div>`;content.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{const i=+b.dataset.card;if(matchOpen.includes(i)||matchDone.includes(i)||matchOpen.length===2)return;matchOpen.push(i);matching();if(matchOpen.length===2){const [a,b]=matchOpen;if(matchCards[a].id===matchCards[b].id){matchDone.push(a,b);matchOpen=[];matching()}else{const fb=$('#matchFeedback');fb.textContent=T('try');setTimeout(()=>{matchOpen=[];matching()},850)}}});$('#resetMatch').onclick=()=>{resetMatch();matching()}}
function resetMatch(){const base=[{id:1,emoji:'🐱',name:'Cat'},{id:2,emoji:'🐶',name:'Dog'},{id:3,emoji:'🍎',name:'Apple'},{id:4,emoji:'🐟',name:'Fish'}];matchCards=[...base,...base].sort(()=>Math.random()-.5);matchOpen=[];matchDone=[]}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));$('#language').addEventListener('change',e=>{lang=e.target.value;$('#tagline').textContent=T('tag');$('#welcome').textContent=T('welcome');render()});
render();
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
})();
</script>
</body></html>
